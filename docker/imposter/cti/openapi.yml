openapi: 3.0.0
info:
  title: Wazuh CTI Console Mock API
  description: |
    Mock API for the CTI Console registration and authorization flow.

    Implements the OAuth 2.0 Device Authorization Grant via a single endpoint:
    `POST /api/v1/platform/environments/token`.

    The endpoint behaviour depends on the request body:
      - With only `client_id`: returns the device authorization response.
      - With `grant_type=urn:ietf:params:oauth:grant-type:device_code`,
        `client_id` and `device_code`: returns the access token (success) or
        an OAuth error (`authorization_pending`, `slow_down`, `access_denied`,
        `expired_token`).

    The error scenario can be forced via the `X-Mock-Scenario` request header
    with one of: `pending`, `slow_down`, `access_denied`, `expired_token`,
    `success`, `environment_exists`, or stored with `POST /mock/cti/scenario`
    for clients that cannot send the header. When neither is set, the mock
    returns `authorization_pending` for the first 2 polls and `success`
    afterwards.

    It also mocks the endpoints the indexer Content Manager calls for the
    plan: `GET /api/v1/platform/environments/me` (scenario stored with
    `POST /mock/cti/environment/scenario`) and `GET /api/v1/catalog/plans`.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: '{protocol}://{address}:{port}'
    variables:
      address:
        default: localhost
      port:
        default: '8080'
      protocol:
        enum:
          - http
          - https
        default: http

tags:
  - name: CTI Console
    description: CTI Console registration and authorization endpoints

paths:
  /api/v1/platform/environments/token:
    post:
      summary: Device Authorization Grant endpoint
      description: |
        Single endpoint that handles both the Device Authorization Request
        and the Access Token polling, following RFC 8628.
      operationId: platformEnvironmentsToken
      tags:
        - CTI Console
      parameters:
        - in: header
          name: X-Mock-Scenario
          required: false
          description: |
            Forces a specific polling scenario. One of: `pending`, `slow_down`,
            `access_denied`, `expired_token`, `success`.
          schema:
            type: string
            enum:
              - pending
              - slow_down
              - access_denied
              - expired_token
              - success
              - environment_exists
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeviceAuthorizationRequest'
                - $ref: '#/components/schemas/TokenPollingRequest'
            examples:
              device_authorization_request:
                summary: Device Authorization Request
                value:
                  client_id: a17c21ed
              token_polling_request:
                summary: Token Polling Request
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  client_id: a17c21ed
                  device_code: mock_device_code_123
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeviceAuthorizationRequest'
                - $ref: '#/components/schemas/TokenPollingRequest'
      responses:
        '200':
          description: |
            OK - Either the Device Authorization Response or a successful
            Access Token Response, depending on the request body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeviceAuthorizationResponse'
                  - $ref: '#/components/schemas/TokenResponse'
              examples:
                device_authorization:
                  summary: Device Authorization Response
                  value:
                    device_code: mock_device_code_123
                    user_code: WZH-999
                    verification_uri: https://cti.wazuh.com/activate
                    expires_in: 600
                    interval: 5
                token_success:
                  summary: Access Token Response
                  value:
                    access_token: asdf1234
                    token_type: Bearer
                    expires_in: 3600
        '400':
          description: |
            Bad Request - OAuth 2.0 error response while polling for the
            access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authorization_pending:
                  summary: User has not yet authorized the device
                  value:
                    error: authorization_pending
                slow_down:
                  summary: Polling too frequently
                  value:
                    error: slow_down
                access_denied:
                  summary: User denied the authorization request
                  value:
                    error: access_denied
                expired_token:
                  summary: Device code expired
                  value:
                    error: expired_token

  /mock/cti/scenario:
    post:
      summary: Store the polling scenario (mock only)
      description: |
        Stores the scenario used by token polling requests that carry no
        `X-Mock-Scenario` header, such as the ones sent by the dashboard
        server. An empty or `default` scenario restores the default behaviour.
      operationId: mockCtiScenario
      tags:
        - CTI Console
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MockScenarioRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/MockScenarioRequest'
      responses:
        '200':
          description: OK - The scenario now in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockScenarioRequest'
        '400':
          description: Bad Request - Unknown scenario.

  /api/v1/platform/environments/me:
    get:
      summary: Plan of the registered environment
      description: |
        Called by the indexer Content Manager with the stored access token.
        Returns the environment, its organization, its registration date, the
        active plan and the subscriptions paying for it. The answer is chosen
        by the scenario stored with `POST /mock/cti/environment/scenario`.
      operationId: getEnvironmentMe
      tags:
        - CTI Console
      responses:
        '200':
          description: OK - The registered environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMe'
        '401':
          description: Unauthorized - The access token was rejected.
        '503':
          description: Service Unavailable - The CTI Console cannot answer.

  /mock/cti/environment/scenario:
    post:
      summary: Store the environments/me scenario (mock only)
      description: |
        Stores the scenario answered by `GET /api/v1/platform/environments/me`.
        An empty or `default` scenario restores `professional`.
      operationId: mockCtiEnvironmentScenario
      tags:
        - CTI Console
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MockEnvironmentScenarioRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/MockEnvironmentScenarioRequest'
      responses:
        '200':
          description: OK - The scenario now in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockEnvironmentScenarioRequest'
        '400':
          description: Bad Request - Unknown scenario.

  /api/v1/catalog/plans:
    get:
      summary: Public catalog of plans
      description: |
        Called by the indexer Content Manager while it is not registered, to
        find the public plan.
      operationId: getCatalogPlans
      tags:
        - CTI Console
      responses:
        '200':
          description: OK - The plans of the catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'

components:
  schemas:
    MockEnvironmentScenarioRequest:
      type: object
      properties:
        scenario:
          type: string
          enum:
            - default
            - professional
            - canceling
            - open
            - token_rejected
            - unavailable
          example: canceling
      required:
        - scenario

    Plan:
      type: object
      properties:
        name:
          type: string
          example: Professional
        is_public:
          type: boolean
          example: false
        features:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              resource:
                type: string
              type:
                type: string

    EnvironmentMe:
      type: object
      properties:
        name:
          type: string
          example: environment-01
        organization:
          type: object
          properties:
            name:
              type: string
              example: Acme Corp
        registered_at:
          type: string
          format: date-time
          example: '2026-03-01T10:00:00Z'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        subscriptions:
          type: array
          items:
            type: object
            properties:
              plan:
                type: string
                example: Professional
              interval:
                type: string
                enum:
                  - month
                  - year
              started_at:
                type: string
                format: date-time
              renews_at:
                type: string
                format: date-time
                nullable: true
              expires_at:
                type: string
                format: date-time
                nullable: true

    MockScenarioRequest:
      type: object
      properties:
        scenario:
          type: string
          enum:
            - default
            - success
            - pending
            - slow_down
            - access_denied
            - expired_token
            - environment_exists
          example: environment_exists
      required:
        - scenario

    DeviceAuthorizationRequest:
      type: object
      description: Initial request to start the Device Authorization Grant flow.
      properties:
        client_id:
          type: string
          description: The instance UID.
          example: a17c21ed
      required:
        - client_id

    TokenPollingRequest:
      type: object
      description: Polling request to obtain the access token.
      properties:
        grant_type:
          type: string
          description: OAuth 2.0 grant type for device authorization.
          enum:
            - urn:ietf:params:oauth:grant-type:device_code
          example: urn:ietf:params:oauth:grant-type:device_code
        client_id:
          type: string
          description: The instance UID.
          example: a17c21ed
        device_code:
          type: string
          description: Device verification code from the authorization response.
          example: mock_device_code_123
      required:
        - grant_type
        - client_id
        - device_code

    DeviceAuthorizationResponse:
      type: object
      description: Response containing the device and user codes.
      properties:
        device_code:
          type: string
          example: mock_device_code_123
        user_code:
          type: string
          example: WZH-999
        verification_uri:
          type: string
          format: uri
          example: https://cti.wazuh.com/activate
        expires_in:
          type: integer
          example: 600
        interval:
          type: integer
          example: 5
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval

    TokenResponse:
      type: object
      description: Response containing the OAuth 2.0 access token.
      properties:
        access_token:
          type: string
          example: asdf1234
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          example: 3600
      required:
        - access_token
        - token_type
        - expires_in

    ErrorResponse:
      type: object
      description: OAuth 2.0 error response.
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_request
          example: authorization_pending
        error_description:
          type: string
          example: The authorization request is still pending
      required:
        - error
