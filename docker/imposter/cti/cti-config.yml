---
plugin: openapi
specFile: openapi.yml

system:
  stores:
    storeCti:
      preloadData:
        pollCount: 0

resources:
  # Single endpoint that handles both Device Authorization Request and
  # Access Token polling. The dispatch is performed in the script based on
  # the request body and the optional X-Mock-Scenario header.
  - method: POST
    path: /api/v1/platform/environments/token
    response:
      scriptFile: token.js

  # Mock-only control endpoint: stores the polling scenario for requests that
  # do not send the `X-Mock-Scenario` header (see scenario.js).
  - method: POST
    path: /mock/cti/scenario
    response:
      scriptFile: scenario.js
