---
plugin: openapi
specFile: openapi.yml

system:
  stores:
    storeCti:
      preloadData:
        pollCount: 0

resources:
  # Single endpoint that handles both Device Authorization Request and
  # Access Token polling. The dispatch is performed in the script based on
  # the request body and the optional X-Mock-Scenario header.
  - method: POST
    path: /api/v1/platform/environments/token
    response:
      scriptFile: token.js

  # Mock-only control endpoint: stores the polling scenario for requests that
  # do not send the `X-Mock-Scenario` header (see scenario.js).
  - method: POST
    path: /mock/cti/scenario
    response:
      scriptFile: scenario.js

  # Plan of the registered environment, read by the indexer Content Manager
  # with the stored access token (see environment.js).
  - method: GET
    path: /api/v1/platform/environments/me
    response:
      scriptFile: environment.js

  # Mock-only control endpoint: stores the `environments/me` scenario (see
  # environment-scenario.js).
  - method: POST
    path: /mock/cti/environment/scenario
    response:
      scriptFile: environment-scenario.js

  # Public plans, read by the indexer while it is not registered.
  - method: GET
    path: /api/v1/catalog/plans
    response:
      statusCode: 200
      file: responses/catalog_plans.json
      headers:
        Content-Type: application/json
